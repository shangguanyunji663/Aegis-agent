services:
  app:
    build: .
    ports:
      - "8091:8091"
    environment:
      DATABASE_URL: mysql+pymysql://root:123456@mysql:3306/aegis?charset=utf8mb4
      EMBEDDING_PROVIDER: local
      REDIS_URL: redis://redis:6379/0
      VECTOR_ENABLED: "true"
      VECTOR_REQUIRED: "false"
      VECTOR_BACKEND: chroma
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: "30"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION_NAME: aegis_knowledge
      AUTH_DEFAULT_ADMIN_USERNAME: admin
      AUTH_DEFAULT_ADMIN_PASSWORD: admin123!
      AUTH_DEFAULT_STUDENT_USERNAME: student
      AUTH_DEFAULT_STUDENT_PASSWORD: student123!
    depends_on:
      - mysql
      - redis
      - chroma
    volumes:
      - ./data:/app/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: aegis
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  mysql-data:
  redis-data:
  chroma-data:
