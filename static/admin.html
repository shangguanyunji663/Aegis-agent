<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>咨询工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/styles.css?v=0.13.0" />
  </head>
  <body class="admin-page">
    <header class="role-topbar">
      <div class="role-brand">
        <div class="role-logo admin-logo">A</div>
        <div>
          <p class="eyebrow">校园心理支持平台 · 教师工作区</p>
          <h1>咨询工作台</h1>
        </div>
      </div>
      <div class="top-actions">
        <div class="topbar-greet"><strong id="greet"></strong><span id="greet-date"></span></div>
        <span id="health" class="status-pill">检测中</span>
        <span id="model-state" class="status-pill secondary">模型状态</span>
        <div class="user-summary compact"><strong id="active-account">管理员</strong><span>管理员端</span></div>
        <button id="refresh-admin" class="ghost-btn" type="button">刷新</button>
        <button id="logout-btn" class="ghost-btn" type="button">退出</button>
      </div>
    </header>

    <main class="admin-layout">
      <section class="admin-metrics">
        <div class="metric"><span>报告数</span><strong id="metric-reports">0</strong></div>
        <div class="metric"><span>高风险</span><strong id="metric-high">0</strong></div>
        <div class="metric"><span>个案数</span><strong id="metric-cases">0</strong></div>
        <div class="metric"><span>工具任务</span><strong id="metric-tools">0</strong></div>
        <div class="metric"><span>工具记录</span><strong id="metric-tool-records">0</strong></div>
        <div class="metric"><span>审计</span><strong id="metric-audits">0</strong></div>
      </section>

      <section class="admin-columns">
        <div class="admin-stack">
          <section class="panel-card" data-tabs="support">
            <div class="section-title">
              <div class="seg-tabs">
                <button class="seg-tab active" type="button" data-seg-tab="cases" aria-pressed="true">个案</button>
                <button class="seg-tab" type="button" data-seg-tab="knowledge" aria-pressed="false">知识库</button>
                <button class="seg-tab" type="button" data-seg-tab="runtime" aria-pressed="false">协作状态</button>
              </div>
            </div>
            <div class="card-body">
              <div class="seg-panel active" data-seg-panel="cases">
                <div id="cases-list" class="stack empty">暂无个案</div>
              </div>
              <div class="seg-panel" data-seg-panel="knowledge">
                <div class="knowledge-tools">
                  <div class="tool-line">
                    <input id="knowledge-query" type="text" placeholder="输入关键词检索知识库" />
                    <button id="search-knowledge" class="mini-btn" type="button">搜索</button>
                  </div>
                  <div id="knowledge-search-results" class="stack empty">暂无检索</div>
                  <div class="tool-line">
                    <input id="knowledge-filename" type="text" placeholder="文件名,如:睡眠知识.md" />
                    <button id="upload-knowledge" class="mini-btn approve" type="button">上传知识</button>
                  </div>
                  <textarea id="knowledge-content" rows="4" placeholder="粘贴文章内容(Markdown 或纯文本)"></textarea>
                  <div class="row-actions compact">
                    <button id="rebuild-knowledge" class="ghost-btn" type="button">重建索引</button>
                    <button id="backup-knowledge" class="ghost-btn" type="button">备份知识库</button>
                  </div>
                </div>
                <div id="knowledge-status" class="stack empty">正在加载</div>
              </div>
              <div class="seg-panel" data-seg-panel="runtime">
                <div id="agent-status-box" class="stack empty">正在读取</div>
              </div>
            </div>
          </section>
        </div>

        <div class="admin-stack">
          <section class="panel-card" data-tabs="review">
            <div class="section-title">
              <div class="seg-tabs">
                <button class="seg-tab active" type="button" data-seg-tab="reports" aria-pressed="true">风险报告</button>
                <button class="seg-tab" type="button" data-seg-tab="traces" aria-pressed="false">对话回放</button>
              </div>
            </div>
            <div class="card-body">
              <div class="seg-panel active" data-seg-panel="reports">
                <div id="reports-list" class="stack empty">暂无报告</div>
              </div>
              <div class="seg-panel" data-seg-panel="traces">
                <div id="trace-list" class="stack empty">暂无 trace</div>
              </div>
            </div>
          </section>
        </div>

        <aside class="admin-detail">
          <section class="panel-card detail-card">
            <div class="section-title"><h2>详情</h2><span id="detail-title">未选择</span></div>
            <div class="card-body">
<pre id="detail-json" class="detail-json">点击任意列表中的行，这里会显示它的完整信息。</pre>
            </div>
          </section>
          <section class="panel-card workspace-card" data-tabs="workspace">
            <div class="section-title workspace-title">
              <h2>工作台</h2>
              <div class="seg-tabs">
                <button class="seg-tab active" type="button" data-seg-tab="jobs" aria-pressed="true">工具任务</button>
                <button class="seg-tab" type="button" data-seg-tab="records" aria-pressed="false">执行记录</button>
                <button class="seg-tab" type="button" data-seg-tab="eval" aria-pressed="false">评测</button>
                <button class="seg-tab" type="button" data-seg-tab="audit" aria-pressed="false">审计</button>
              </div>
            </div>
            <div class="card-body">
              <div class="seg-panel active" data-seg-panel="jobs">
                <div class="seg-panel-head">
                  <span id="tool-worker-state" class="status-pill secondary">执行器</span>
                  <button id="run-tool-worker" class="ghost-btn" type="button">立即派发</button>
                </div>
                <div id="tool-jobs-list" class="stack empty">暂无任务</div>
              </div>
              <div class="seg-panel" data-seg-panel="records">
                <div id="tool-records-list" class="stack empty">暂无记录</div>
              </div>
              <div class="seg-panel" data-seg-panel="eval">
                <div class="seg-panel-head">
                  <span class="knowledge-line">内置测试题,不使用真实学生数据</span>
                  <button id="run-eval" class="ghost-btn" type="button">运行评测</button>
                </div>
                <div id="eval-results" class="stack empty">暂无评测</div>
              </div>
              <div class="seg-panel" data-seg-panel="audit">
                <div id="audit-list" class="stack empty">暂无审计</div>
              </div>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script src="/static/admin.js?v=0.13.0"></script>
  </body>
</html>
