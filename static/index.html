<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aegis 登录</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/styles.css?v=0.8.0" />
  </head>
  <body class="portal-page">
    <header class="role-topbar">
      <div class="role-brand">
        <div class="role-logo">A</div>
        <div>
          <p class="eyebrow">校园心理支持平台</p>
          <h1>Aegis 校园心理智能体</h1>
        </div>
      </div>
      <div class="top-actions">
        <span id="health" class="status-pill">检测中</span>
        <span id="agent-status" class="status-pill secondary">就绪</span>
      </div>
    </header>

    <main class="portal-shell">
      <section class="portal-login panel-card">
          <p class="eyebrow">账号登录</p>
        <h2>选择账号进入对应工作台</h2>
        <form id="login-form" class="auth-form">
          <label for="login-username">用户名</label>
          <input id="login-username" type="text" value="student" autocomplete="username" placeholder="请输入用户名" />
          <label for="login-password">密码</label>
          <input id="login-password" type="password" value="student123!" autocomplete="current-password" placeholder="请输入密码" />
          <button id="login-submit" type="submit" class="primary-btn">登录并进入</button>
        </form>
        <form id="register-form" class="auth-form hidden">
          <label for="reg-username">用户名</label>
          <input id="reg-username" type="text" autocomplete="username" placeholder="2-32 位字母、数字、下划线或中文" />
          <label for="reg-password">密码</label>
          <input id="reg-password" type="password" autocomplete="new-password" placeholder="至少 6 位" />
          <label for="reg-role">注册身份</label>
          <select id="reg-role">
            <option value="student" selected>学生</option>
            <option value="teacher">教师(需邀请码)</option>
          </select>
          <div id="invite-line" class="hidden">
            <label for="reg-invite">教师邀请码</label>
            <input id="reg-invite" type="password" placeholder="请输入学校发放的邀请码" />
          </div>
          <button id="register-submit" type="submit" class="primary-btn">注册并进入</button>
        </form>
        <div id="auth-error" class="callout error hidden"></div>
        <div class="auth-hint">
          <span id="toggle-auth" role="button" tabindex="0">没有账号?注册一个</span>
        </div>
        <div class="auth-hint">
          <span>演示账号 student / student123!</span>
          <span>admin / admin123!</span>
        </div>
      </section>

      <section class="entry-grid">
        <article class="entry-card student-entry">
          <span>学生入口</span>
          <h3>学生端</h3>
          <p>心理陪伴对话、快捷表达、会话历史和即时支持。</p>
        </article>
        <article class="entry-card admin-entry">
          <span>教师 / 管理员入口</span>
          <h3>管理后台</h3>
          <p>风险报告、个案闭环、对话回放、知识库和工具审计。</p>
        </article>
      </section>
    </main>

    <script src="/static/login.js?v=0.8.0"></script>
  </body>
</html>
