<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aegis 登录</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="portal-page">
    <header class="role-topbar">
      <div class="role-brand">
        <div class="role-logo">A</div>
        <div>
          <p class="eyebrow">AEGIS PSYCH AGENT</p>
          <h1>Aegis 校园心理智能体</h1>
        </div>
      </div>
      <div class="top-actions">
        <span id="health" class="status-pill">checking</span>
        <span id="agent-status" class="status-pill secondary">agent</span>
      </div>
    </header>

    <main class="portal-shell">
      <section class="portal-login panel-card">
        <p class="eyebrow">ACCOUNT GATE</p>
        <h2>选择账号进入对应工作台</h2>
        <form id="login-form" class="auth-form">
          <label for="login-username">用户名</label>
          <input id="login-username" type="text" value="student" autocomplete="username" placeholder="请输入用户名" />
          <label for="login-password">密码</label>
          <input id="login-password" type="password" value="student123!" autocomplete="current-password" placeholder="请输入密码" />
          <button id="login-submit" type="submit" class="primary-btn">登录并进入</button>
        </form>
        <div id="auth-error" class="callout error hidden"></div>
        <div class="auth-hint">
          <span>student / student123!</span>
          <span>admin / admin123!</span>
        </div>
      </section>

      <section class="entry-grid">
        <article class="entry-card student-entry">
          <span>STUDENT</span>
          <h3>学生端</h3>
          <p>心理陪伴对话、快捷表达、会话历史和即时支持。</p>
        </article>
        <article class="entry-card admin-entry">
          <span>COUNSELOR ADMIN</span>
          <h3>管理员端</h3>
          <p>风险报告、个案闭环、Agent trace、知识库和工具审计。</p>
        </article>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
