base_model:
  repo_id: Qwen/Qwen3.5-2B-Base
  revision: b1485b2fa6dfa1287294f269f5fb618e03d52d7c
  trust_remote_code: false
  text_only: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: none
  # 脚本先对官方模型结构做 gate；只有这些文本层名称实际存在才允许训练。
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_a
    - in_proj_b
    - out_proj

training:
  output_root: D:/AegisTraining/checkpoints/aegis-risk-qwen3.5-2b
  cutoff_len: 512
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 0.0001
  weight_decay: 0.0
  num_train_epochs: 3
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  optim: paged_adamw_8bit
  max_grad_norm: 1.0
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  seed: 42
  bf16: true
  fp16_fallback: true
  early_stopping_patience: 2

evaluation:
  max_reason_chars: 20
  risk_timeout_seconds: 8.0
  implicit_high_min_new_hits: 4
  max_third_person_new_high_false_positives: 1
  max_non_high_to_high_fpr_increase: 0.02
